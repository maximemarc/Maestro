# Pipeline Maestro — exécuteur Docker.
#
# Le modèle BUILD_DIR de la skill `gitlab-ci-conventions` ne s'applique pas ici :
# il compense l'absence d'espace de travail partagé entre les jobs d'un runner
# shell, et suppose une chaîne Castor. Ce dépôt n'a pas de Castor et chaque job
# repart d'un clone propre dans $CI_PROJECT_DIR. Pas de GIT_STRATEGY: none, pas
# de cd $BUILD_DIR, pas de job `clean` — ces règles appartiennent à l'autre
# modèle et les mélanger produit des échecs opaques.
#
# 🔒 Le stage `analyze` rejoue exactement ce que fait `npm run qa` en local :
# types, style, format et tests. Un pipeline qui ne lance pas les tests ne peut
# pas porter la règle « pas de merge sans CI verte » (section 5 du CLAUDE.md).

default:
  # Version complète épinglée, jamais un tag flottant : `node:22` change sous les
  # pieds du dépôt et fait échouer un pipeline pour une raison sans rapport avec
  # le commit. Image Docker Hub officielle, faute d'équivalent au registry interne.
  image: node:22.23.2-bookworm-slim
  tags: [docker]
  # Un push supplémentaire annule le pipeline précédent au lieu de saturer le
  # runner.
  interruptible: true

# Évite le doublon « pipeline de branche + pipeline de MR » : sur une branche qui
# a une MR ouverte, seul le pipeline de MR tourne.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - analyze
  - build

variables:
  # Le cache npm doit vivre sous $CI_PROJECT_DIR : GitLab n'archive que ce qui
  # s'y trouve. Ailleurs, le cache est silencieusement vide à chaque job.
  npm_config_cache: '$CI_PROJECT_DIR/.npm'

# Socle commun aux jobs Node.
#
# `npm ci` est rejoué dans chaque job plutôt que transporté en artefact :
# node_modules pèse plusieurs centaines de mégaoctets, ce qui coûte plus cher à
# téléverser et retélécharger qu'à réinstaller depuis un cache chaud. La clé de
# cache suit le verrou : elle s'invalide exactement quand l'arbre change.
.node:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  before_script:
    - npm ci --prefer-offline --no-audit --no-fund

# -- analyze : un job = un contrôle = un motif d'échec identifiable ------------

types:
  extends: .node
  stage: analyze
  script:
    - npm run typecheck

style:
  extends: .node
  stage: analyze
  script:
    - npm run lint

format:
  extends: .node
  stage: analyze
  script:
    - npm run format:check

tests:
  extends: .node
  stage: analyze
  script:
    - npm test

# 🔒 Recherche de secrets (section 6 du CLAUDE.md).
#
# GIT_DEPTH: "0" est indispensable : le clone est superficiel par défaut, et
# gitleaks n'y verrait qu'un commit. Il passerait au vert sans avoir rien
# contrôlé — un faux vert sur un contrôle de secrets est pire que pas de
# contrôle du tout.
secrets:
  stage: analyze
  image:
    name: zricethezav/gitleaks:v8.30.1
    # L'image définit un entrypoint : sans ce vidage, GitLab ne peut pas y
    # enchaîner son propre script.
    entrypoint: ['']
  variables:
    GIT_DEPTH: '0'
  script:
    - gitleaks detect --source . --redact --verbose --no-banner

# -- build : l'interface doit compiler, pas seulement typer -------------------

interface:
  extends: .node
  stage: build
  needs:
    - types
  script:
    - npm run build
  artifacts:
    paths:
      - packages/web/dist
    expire_in: 1 week
