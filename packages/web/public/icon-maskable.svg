<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
  <!--
    Variante « maskable » : le système découpe l'icône en cercle, en squircle ou
    en goutte selon la plateforme, et rogne jusqu'à 20 % sur chaque bord. Le
    motif est donc réduit et recentré dans la zone sûre, sinon les curseurs
    seraient coupés net. Le fond couvre tout le carré, sans coins arrondis :
    c'est le masque du système qui les donne.
  -->
  <rect width="32" height="32" fill="#0a0e14" />
  <g transform="translate(16 16) scale(0.62) translate(-16 -16)">
    <g stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round" fill="none">
      <path d="M10 7v18M16 7v18M22 7v18" />
    </g>
    <g fill="#22d3ee">
      <circle cx="10" cy="12" r="3" />
      <circle cx="16" cy="21" r="3" />
      <circle cx="22" cy="15" r="3" />
    </g>
  </g>
</svg>
